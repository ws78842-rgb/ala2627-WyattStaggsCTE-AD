<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ketel Marte Baseball Field</title>
  <style>
    :root {
      --grass: #0f7a3f;
      --grass-deep: #0b5f35;
      --dirt: #d4a76a;
      --plate: #f9f1df;
      --ink: #102033;
      --navy: #0d1b2a;
      --gold: #f4d35e;
      --white: #f7f7f5;
      --shadow: rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #204d6d 0%, #0d1b2a 45%, #08131d 100%);
      color: var(--white);
    }

    .page {
      width: min(92vw, 980px);
      padding: 30px 18px 40px;
    }

    .scoreboard {
      background: rgba(8, 18, 28, 0.82);
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 18px 32px rgba(0, 0, 0, 0.25);
      padding: 18px 22px 12px;
      text-align: center;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .scoreboard .tag {
      display: block;
      font-size: 0.8rem;
      color: #dfeaf8;
      opacity: 0.9;
    }

    .scoreboard h1 {
      margin: 10px 0 0;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
    }

    .field {
      position: relative;
      height: min(72vw, 650px);
      min-height: 420px;
      max-height: 650px;
      background: linear-gradient(180deg, var(--grass) 0%, var(--grass-deep) 100%);
      border: 6px solid rgba(255, 255, 255, 0.18);
      border-top: none;
      border-radius: 0 0 28px 28px;
      overflow: hidden;
      box-shadow: 0 18px 32px rgba(0, 0, 0, 0.28);
    }

    .field::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.18) 0, rgba(255, 255, 255, 0) 33%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(0, 0, 0, 0.08));
    }

    .crowd {
      position: absolute;
      inset: 0 0 auto 0;
      height: 130px;
      background:
        repeating-linear-gradient(90deg,
          rgba(255, 255, 255, 0.18) 0 2px,
          rgba(255, 255, 255, 0.04) 2px 8px),
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02));
      opacity: 0.7;
      z-index: 1;
    }

    .crowd::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -18px;
      height: 28px;
      background: linear-gradient(180deg, rgba(13, 27, 42, 0.2), rgba(13, 27, 42, 0.7));
    }

    .stadium-rim {
      position: absolute;
      inset: 0 0 auto 0;
      height: 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.03));
      border-bottom: 3px solid rgba(255, 255, 255, 0.12);
    }

    .score-mini {
      position: absolute;
      top: 30px;
      right: 28px;
      z-index: 7;
      background: rgba(8, 18, 28, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
    }

    .score-mini strong {
      display: block;
      margin-top: 4px;
      font-size: 1.2rem;
      letter-spacing: 0.06em;
      color: var(--white);
    }

    .infield {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 52%;
      height: 52%;
      transform: translate(-50%, -50%);
      background: var(--dirt);
      border: 6px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      box-shadow: inset 0 0 0 3px rgba(124, 84, 35, 0.55);
    }

    .diamond {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 35%;
      height: 35%;
      transform: translate(-50%, -50%) rotate(45deg);
      border: 6px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.08);
    }

    .mound {
      position: absolute;
      left: 50%;
      top: 57%;
      width: 11%;
      height: 11%;
      transform: translate(-50%, -50%);
      background: rgba(255, 245, 220, 0.92);
      border-radius: 50%;
      box-shadow: inset 0 0 0 6px rgba(145, 95, 40, 0.28);
    }

    .mound::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 42%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(118, 83, 41, 0.25);
    }

    .home-plate {
      position: absolute;
      left: 50%;
      bottom: 9%;
      width: 82px;
      height: 82px;
      transform: translateX(-50%) rotate(45deg);
      background: var(--plate);
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.08);
    }

    .base {
      position: absolute;
      width: 42px;
      height: 42px;
      background: var(--plate);
      transform: rotate(45deg);
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.08);
    }

    .base-one {
      right: 26%;
      top: 38%;
    }

    .base-two {
      left: 50%;
      top: 18%;
      transform: translateX(-50%) rotate(45deg);
    }

    .base-three {
      left: 26%;
      top: 38%;
    }

    .line {
      position: absolute;
      background: rgba(255, 255, 255, 0.18);
      z-index: 2;
    }

    .line-one {
      left: 29%;
      top: 53%;
      width: 42%;
      height: 4px;
      transform: rotate(45deg);
    }

    .line-two {
      right: 29%;
      top: 53%;
      width: 42%;
      height: 4px;
      transform: rotate(-45deg);
    }

    .player {
      position: absolute;
      left: 50%;
      top: 62%;
      width: 56px;
      height: 120px;
      transform: translateX(-50%);
      z-index: 5;
    }

    .player .head {
      position: absolute;
      left: 50%;
      top: 0;
      width: 26px;
      height: 26px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #f1c9a5;
      box-shadow: inset -4px -2px 0 rgba(0, 0, 0, 0.08);
    }

    .player .body {
      position: absolute;
      left: 50%;
      top: 24px;
      width: 40px;
      height: 52px;
      transform: translateX(-50%);
      border-radius: 12px 12px 10px 10px;
      background: #1f4b9f;
      border: 3px solid rgba(255, 255, 255, 0.18);
    }

    .player .arm,
    .player .leg {
      position: absolute;
      background: #1f4b9f;
      border-radius: 12px;
    }

    .player .arm {
      width: 12px;
      height: 42px;
      top: 28px;
    }

    .player .arm.left {
      left: 8px;
      transform: rotate(26deg);
    }

    .player .arm.right {
      right: 8px;
      transform: rotate(-26deg);
    }

    .player .leg {
      width: 12px;
      height: 42px;
      top: 72px;
    }

    .player .leg.left {
      left: 18px;
    }

    .player .leg.right {
      right: 18px;
    }

    .caption {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 6;
      font-size: clamp(0.8rem, 1.8vw, 1.2rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #edf4ff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.32);
    }

    .bat {
      position: absolute;
      right: 18%;
      top: 18%;
      width: 180px;
      height: 12px;
      background: linear-gradient(90deg, #d5a778 0%, #f0d9ae 18%, #ab7d4d 100%);
      border-radius: 999px;
      transform: rotate(28deg);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
      z-index: 3;
    }

    .bat::before {
      content: "";
      position: absolute;
      right: -4px;
      top: -5px;
      width: 26px;
      height: 22px;
      border-radius: 50%;
      background: #d1a067;
      box-shadow: inset 0 0 0 4px rgba(0, 0, 0, 0.06);
    }

    .baseball {
      position: absolute;
      right: 13%;
      top: 22%;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fffdf9 0%, #f3f3eb 20%, #d7d7d2 48%, #b8b8b2 100%);
      border: 2px solid rgba(88, 88, 88, 0.8);
      box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.08);
      z-index: 4;
    }

    .baseball::before {
      content: "";
      position: absolute;
      inset: 5px 7px 5px 7px;
      border-radius: 50%;
      border-left: 2px solid rgba(0, 0, 0, 0.2);
      transform: rotate(-18deg);
    }

    .fence {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42px;
      background: repeating-linear-gradient(90deg,
          rgba(255, 255, 255, 0.5) 0 2px,
          rgba(255, 255, 255, 0.08) 2px 12px);
      opacity: 0.4;
      z-index: 2;
    }

    @keyframes floatBall {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-8px) rotate(8deg);
      }
    }

    .baseball {
      animation: floatBall 2.4s ease-in-out infinite;
    }

    @media (max-width: 640px) {
      .page {
        padding-top: 18px;
      }

      .scoreboard {
        padding-top: 12px;
      }

      .field {
        min-height: 360px;
      }

      .base {
        width: 30px;
        height: 30px;
      }

      .home-plate {
        width: 56px;
        height: 56px;
      }

      .player {
        transform: translateX(-50%) scale(0.9);
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="scoreboard">
      <span class="tag">Arizona Diamondbacks</span>
      <h1>Ketel Marte</h1>
    </div>

    <div class="field" aria-label="Baseball field with Ketel Marte">
      <div class="crowd"></div>
      <div class="stadium-rim"></div>
      <div class="score-mini">Game Day<strong>4 - 2</strong></div>
      <div class="bat"></div>
      <div class="baseball"></div>
      <div class="infield"></div>
      <div class="diamond"></div>
      <div class="mound"></div>
      <div class="home-plate"></div>
      <div class="base base-one"></div>
      <div class="base base-two"></div>
      <div class="base base-three"></div>
      <div class="line line-one"></div>
      <div class="line line-two"></div>

      <div class="player" aria-hidden="true">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

      <div class="caption">#4 • Diamondback Star</div>
      <div class="fence"></div>
    </div>
  </div>
</body>

</html>
